# Levanta todo con:  docker-compose up --build   →  http://localhost:8000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vennex
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vennex"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/vennex
      # Solo para probar en local. En un servidor real se define un JWT_SECRET propio.
      JWT_SECRET: ${JWT_SECRET:-solo-para-desarrollo-cambie-este-secreto-en-produccion}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      SEED_DEMO: "1"   # carga las 40 solicitudes de ejemplo si la base está vacía

volumes:
  pgdata:
